<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Park Visits — browser probe</title>
<!--
  Diagnostic page for working out why the cards fail on an old embedded
  browser (Samsung Family Hub, smart TVs, kiosk panels).

  Deliberately written in ES3: var, function expressions, string
  concatenation, no classes, no arrows, no template literals. If this page
  itself failed to run, it would tell us nothing about the cards.

  Served unauthenticated from the integration's static path, so a device
  that can't log in to Home Assistant can still load it:
      http://<home-assistant>:8123/park_visits_frontend/probe.html
-->
<style>
  body {
    font-family: sans-serif; background: #111; color: #eee;
    margin: 0; padding: 16px; font-size: 20px; line-height: 1.45;
  }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 21px; margin: 20px 0 6px; border-bottom: 1px solid #444; }
  .row { padding: 2px 0; }
  .yes { color: #6ddf6d; }
  .no  { color: #ff7b7b; font-weight: bold; }
  .ua  { font-size: 15px; color: #aaa; word-break: break-all; }
  #errors { color: #ff7b7b; font-size: 17px; white-space: pre-wrap; word-break: break-word; }
  .hint { color: #ffd479; font-size: 17px; margin-top: 8px; }
</style>
</head>
<body>

<h1>Park Visits browser probe</h1>
<div class="ua" id="ua"></div>

<h2>1. Card load result</h2>
<div id="cardresult">Loading the table card…</div>
<div id="errors"></div>

<h2>2. JavaScript features</h2>
<div id="js"></div>

<h2>3. CSS features</h2>
<div id="css"></div>

<h2>4. Card render test</h2>
<div id="render">Waiting for the cards to load…</div>

<h2>5. Other dashboard modules</h2>
<div id="others">Loading…</div>
<!-- The cards are built for real in here; kept out of sight so the page
     stays readable on a small panel. -->
<div id="stage" style="position:absolute; left:-10000px; width:900px;"></div>

<script>
/* Everything below is ES3. No let/const, arrows, or template literals. */
(function () {
  var errorBox = document.getElementById("errors");
  var seenError = false;

  function show(box, label, ok, detail) {
    var div = document.createElement("div");
    div.className = "row";
    div.innerHTML =
      '<span class="' + (ok ? "yes" : "no") + '">' + (ok ? "OK  " : "FAIL") +
      "</span>  " + label + (detail ? '  <span class="ua">' + detail + "</span>" : "");
    box.appendChild(div);
  }

  document.getElementById("ua").appendChild(
    document.createTextNode(navigator.userAgent)
  );

  /* Catch the parse/run error from the card module. This is the whole point
     of the page: the message and line number name the exact construct the
     engine chokes on. */
  window.onerror = function (message, source, line, column) {
    seenError = true;
    var where = source ? String(source).split("/").pop() : "unknown file";
    errorBox.appendChild(
      document.createTextNode(
        "\n" + message + "\n    in " + where + " at line " + line +
        (column ? ", column " + column : "") + "\n"
      )
    );
    document.getElementById("cardresult").innerHTML =
      '<span class="no">FAIL</span>  the card did not load — details below';
    return false;
  };

  /* --- JavaScript feature probes -------------------------------------- */
  /* eval() so a syntax error is caught here instead of killing the page. */
  function syntaxWorks(code) {
    try {
      eval(code);
      return true;
    } catch (e) {
      return false;
    }
  }

  var jsBox = document.getElementById("js");
  var jsTests = [
    ["ES2015  class",                  "(function(){ var C = eval('(class {})'); })()"],
    ["ES2015  arrow function",         "eval('(()=>1)')"],
    ["ES2015  template literal",       "eval('`x`')"],
    ["ES2015  let / const",            "eval('let a = 1; const b = 2;')"],
    ["ES2015  default+rest params",    "eval('(function f(a=1, ...r){})')"],
    ["ES2015  destructuring",          "eval('var {a} = {a:1}; var [b] = [2];')"],
    ["ES2015  for...of",               "eval('for (var x of [1]) {}')"],
    ["ES2016  exponent **",            "eval('2 ** 3')"],
    ["ES2017  async / await",          "eval('(async function(){ await 1; })')"],
    ["ES2018  object spread {...x}",   "eval('var o = {...{a:1}};')"],
    ["ES2018  async iteration",        "eval('(async function(){ for await (var x of []) {} })')"],
    ["ES2019  catch without binding",  "eval('try { } catch { }')"],
    ["ES2020  optional chaining ?.",   "eval('var o = {}; o?.a;')"],
    ["ES2020  nullish ??",             "eval('null ?? 1')"],
    ["ES2020  dynamic import()",       "eval('(function(){ return function(){ return import(\"./x.js\"); }; })')"],
    ["ES2021  logical assignment ||=", "eval('var a = 0; a ||= 1;')"],
    ["ES2022  class fields",           "eval('(class { x = 1; })')"]
  ];
  for (var i = 0; i < jsTests.length; i++) {
    show(jsBox, jsTests[i][0], syntaxWorks(jsTests[i][1]));
  }

  /* Runtime APIs the cards actually call. */
  function apiWorks(fn) {
    try { return !!fn(); } catch (e) { return false; }
  }
  var apiTests = [
    ["customElements.define", function () { return window.customElements && window.customElements.define; }],
    ["ES modules (script type=module)", function () {
      var s = document.createElement("script");
      return "noModule" in s;
    }],
    ["Promise",        function () { return window.Promise; }],
    ["fetch",          function () { return window.fetch; }],
    ["Set",            function () { return window.Set; }],
    ["Array.from",     function () { return Array.from; }],
    ["Object.values",  function () { return Object.values; }],
    ["Object.assign",  function () { return Object.assign; }],
    ["String.includes",function () { return "".includes; }],
    ["Number.isNaN",   function () { return Number.isNaN; }],
    ["localeCompare",  function () { return "".localeCompare; }],
    ["FormData",       function () { return window.FormData; }],
    ["WebSocket",      function () { return window.WebSocket; }]
  ];
  for (var j = 0; j < apiTests.length; j++) {
    show(jsBox, apiTests[j][0], apiWorks(apiTests[j][1]));
  }

  /* --- CSS feature probes ---------------------------------------------- */
  var cssBox = document.getElementById("css");
  /* `prop` is the real CSS name (kebab-case) — CSS.supports rejects the
     camelCase DOM spelling, which the style fallback needs instead. */
  function cssWorks(prop, value) {
    if (window.CSS && window.CSS.supports) {
      try { return window.CSS.supports(prop, value); } catch (e) { /* fall through */ }
    }
    var camel = prop.replace(/-([a-z])/g, function (m, c) { return c.toUpperCase(); });
    var el = document.createElement("div");
    try {
      el.style[camel] = value;
      return el.style[camel] !== "";
    } catch (e) {
      return false;
    }
  }

  /* Flex gap needs a real layout test, not CSS.supports: engines from
     Chromium 66-83 support `gap` on grid (so supports() says yes) while
     ignoring it on flex — which is precisely the range in question here. */
  function flexGapWorks() {
    var box = document.createElement("div");
    box.style.display = "flex";
    box.style.flexDirection = "column";
    box.style.rowGap = "10px";
    box.style.position = "absolute";
    box.style.visibility = "hidden";
    box.appendChild(document.createElement("div"));
    box.appendChild(document.createElement("div"));
    document.body.appendChild(box);
    var ok = box.scrollHeight === 10;
    box.parentNode.removeChild(box);
    return ok;
  }
  show(cssBox, "flexbox gap  (used for spacing everywhere)", flexGapWorks());
  show(cssBox, "aspect-ratio  (gallery tiles)", cssWorks("aspect-ratio", "1 / 1"));
  show(cssBox, "position: sticky  (table header)", cssWorks("position", "sticky"));
  show(cssBox, "CSS variables  (all theming)",
    !!(window.CSS && window.CSS.supports && window.CSS.supports("--a", "0")));
  show(cssBox, "object-fit  (photo thumbnails)", cssWorks("object-fit", "cover"));

  /* --- Finally, try to load the real cards ----------------------------- */
  /* Both of them: they're separate files, and a fault in one says nothing
     about the other. The gallery card is the one behind the photo views. */
  var cards = [
    ["park-visits-table-card", "Table card (Parks / Visited views)"],
    ["park-visits-gallery-card", "Gallery card (photo views)"]
  ];
  var resultBox = document.getElementById("cardresult");
  resultBox.innerHTML = "";

  for (var k = 0; k < cards.length; k++) {
    (function (name) {
      var probe = document.createElement("script");
      probe.type = "module";
      probe.src = "/park_visits_frontend/" + name + ".js?probe=" + new Date().getTime();
      probe.onerror = function () {
        seenError = true;
        errorBox.appendChild(document.createTextNode(
          "\n" + name + ": the browser could not fetch or run this file\n"
        ));
      };
      document.head.appendChild(probe);
    })(cards[k][0]);
  }

  /* Whether each element registered is the real answer — a syntax error stops
     the module before customElements.define() at the bottom of the file. */
  setTimeout(function () {
    var anyMissing = false;
    for (var k = 0; k < cards.length; k++) {
      var defined = !!(window.customElements && window.customElements.get &&
                       window.customElements.get(cards[k][0]));
      if (!defined) anyMissing = true;
      show(resultBox, cards[k][1], defined);
    }

    var verdict = document.createElement("div");
    verdict.className = "hint";
    verdict.appendChild(document.createTextNode(
      anyMissing
        ? (seenError
            ? "A card failed to load — the error above names the cause."
            : "A card did not register and reported no error. Check the " +
              "'ES modules' line below.")
        : "Both cards registered. Section 4 says whether they can actually render."
    ));
    resultBox.appendChild(verdict);

    renderTest();
    otherModulesTest();
  }, 4000);

  /**
   * The dashboard loads more than the Park Visits cards.
   *
   * Home Assistant injects every extra module URL into the page, and one of
   * them failing on this engine breaks rendering for everything — a card
   * that works in isolation (sections 1 and 4) can still never appear.
   * card-mod in particular wraps other cards as they render.
   */
  function otherModulesTest() {
    var box = document.getElementById("others");
    box.innerHTML = "";

    /* The paths HACS actually serves. Note that this instance ALSO injects
       /www/community/... copies of the first two, which 404 for every
       browser — harmless, since the Lovelace resource entries below are what
       really load them, but worth knowing when reading these results. */
    var modules = [
      ["/hacsfiles/lovelace-card-mod/card-mod.js", "card-mod (wraps every card)"],
      ["/hacsfiles/kiosk-mode/kiosk-mode.js", "kiosk-mode"],
      ["/hacsfiles/iconset.js", "HACS iconset"],
      ["/hacsfiles/lovelace-mushroom/mushroom.js", "mushroom (any other custom card)"]
    ];

    for (var m = 0; m < modules.length; m++) {
      (function (url, label) {
        var el = document.createElement("script");
        el.type = "module";
        el.src = url + "?probe=" + new Date().getTime();
        el.onload = function () { show(box, label, true); };
        el.onerror = function () {
          show(box, label + "  — failed to load or run", false);
          errorBox.appendChild(document.createTextNode(
            "\n" + url + " failed to load on this browser\n"
          ));
        };
        document.head.appendChild(el);
      })(modules[m][0], modules[m][1]);
    }

    setTimeout(function () {
      if (!box.firstChild) {
        show(box, "no module reported back — none of them loaded", false);
      }
    }, 5000);
  }

  /**
   * Registering is not the same as working: a card can define itself and
   * still throw the moment Home Assistant hands it a config and a hass
   * object, which looks identical to "the card never loaded". This builds
   * the real card against a synthetic hass and reports what happens.
   */
  function renderTest() {
    var box = document.getElementById("render");
    var stage = document.getElementById("stage");
    box.innerHTML = "";

    var mockHass = {
      states: {
        "geo_location.probe_park_a": {
          entity_id: "geo_location.probe_park_a",
          state: "5.5",
          last_updated: "2026-01-01T00:00:00Z",
          attributes: {
            source: "park_visits", friendly_name: "Probe Park A",
            place_id: "ChIJprobeaaa", rank: 1, rating: 4.5, rating_count: 25,
            categories: ["park"], address: "1 Probe St", our_photo_count: 0,
            our_kids_rating: 8, our_overall_rating: 8, our_visit_date: "2026-01-01"
          }
        },
        "geo_location.probe_park_b": {
          entity_id: "geo_location.probe_park_b",
          state: "9.1",
          last_updated: "2026-01-01T00:00:00Z",
          attributes: {
            source: "park_visits", friendly_name: "Probe Park B",
            place_id: "ChIJprobebbb", rank: 2, rating: 4.1, rating_count: 12,
            categories: ["park"], address: "2 Probe St", our_photo_count: 0
          }
        }
      },
      auth: { data: { access_token: "probe" } },
      callApi: function () { return Promise.resolve({}); },
      callWS: function () { return Promise.resolve({ path: "/probe" }); },
      callService: function () { return Promise.resolve(); }
    };

    /* Table card: config mirrors the real dashboard's Parks view. */
    try {
      var table = document.createElement("park-visits-table-card");
      table.setConfig({
        title: "Probe", source: "park_visits",
        default_sort: "rank", default_direction: "asc", show_filter: true
      });
      stage.appendChild(table);
      table.hass = mockHass;

      var rows = table.querySelectorAll("tbody tr").length;
      var headers = table.querySelectorAll("thead th").length;
      show(box, "Table card builds without throwing", true);
      show(box, "Table header rendered (" + headers + " columns)", headers > 0);
      show(box, "Table rows rendered (" + rows + " of 2 parks)", rows === 2);
      if (rows !== 2) {
        show(box, "-> the card runs but produces no rows: this is the bug", false);
      }
    } catch (e) {
      show(box, "Table card THREW: " + (e && e.message ? e.message : e), false);
      errorBox.appendChild(document.createTextNode(
        "\nTable card render error:\n" + (e && e.stack ? e.stack : e) + "\n"
      ));
    }

    /* Gallery card: only that construction survives — its contents arrive
       asynchronously from an endpoint this page isn't authenticated for. */
    try {
      var gallery = document.createElement("park-visits-gallery-card");
      gallery.setConfig({ title: "Probe gallery" });
      stage.appendChild(gallery);
      gallery.hass = mockHass;
      show(box, "Gallery card builds without throwing", true);
    } catch (e2) {
      show(box, "Gallery card THREW: " + (e2 && e2.message ? e2.message : e2), false);
      errorBox.appendChild(document.createTextNode(
        "\nGallery card render error:\n" + (e2 && e2.stack ? e2.stack : e2) + "\n"
      ));
    }
  }
})();
</script>

</body>
</html>
