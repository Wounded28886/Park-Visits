rate_park:
  name: Rate a park
  description: >-
    Record your own review for a tracked park. Photos are attached separately
    by the Park Visits table card, which uploads them to
    /api/park_visits/upload/<place_id>.
  fields:
    place_id:
      name: Park
      description: The Google place_id of the park (the geo_location entity's place_id attribute).
      required: true
      selector:
        text:
    visit_date:
      name: Visit date
      description: The day the visit actually happened. Defaults to today in the table card, but can be back-dated.
      required: true
      selector:
        date:
    kids_rating:
      name: Kids Rating
      description: The kids' rating out of 10. This is the only rating that's required.
      required: true
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          mode: slider
    mums_rating:
      name: Mums Rating
      description: Mum's rating out of 10.
      required: false
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          mode: slider
    dads_rating:
      name: Dads Rating
      description: Dad's rating out of 10.
      required: false
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          mode: slider
    playground_rating:
      name: Playground
      description: Playground rating out of 10.
      required: false
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          mode: slider
    scenery_rating:
      name: Scenery
      description: Scenery rating out of 10.
      required: false
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          mode: slider
    wildlife_rating:
      name: Wildlife
      description: Wildlife rating out of 10.
      required: false
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          mode: slider
    facilities_rating:
      name: Facilities
      description: Facilities rating out of 10.
      required: false
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          mode: slider
    parking_rating:
      name: Parking
      description: Parking rating out of 10.
      required: false
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          mode: slider
    liked:
      name: What we liked
      description: The good bits.
      required: false
      selector:
        text:
          multiline: true
    disliked:
      name: What we didn't like
      description: The not-so-good bits.
      required: false
      selector:
        text:
          multiline: true
    note:
      name: Other notes
      description: Anything else worth remembering.
      required: false
      selector:
        text:
          multiline: true

delete_review:
  name: Delete a review
  description: >-
    Remove our review for a park, including every photo uploaded with it.
    The photo files are deleted from disk. This cannot be undone.
  fields:
    place_id:
      name: Park
      description: The Google place_id of the park.
      required: true
      selector:
        text:

set_next_park:
  name: Set the next park to visit
  description: >-
    Mark a park as the one we plan to visit next. Reviewing that park clears
    the assignment automatically, since by then we've been.
  fields:
    place_id:
      name: Park
      description: The Google place_id of the park.
      required: true
      selector:
        text:

clear_next_park:
  name: Clear the next park
  description: Forget which park we planned to visit next.

delete_photo:
  name: Delete a review photo
  description: Remove a single photo from a park's review and delete the file.
  fields:
    place_id:
      name: Park
      description: The Google place_id of the park.
      required: true
      selector:
        text:
    filename:
      name: Filename
      description: The stored filename of the photo to remove.
      required: true
      selector:
        text:
