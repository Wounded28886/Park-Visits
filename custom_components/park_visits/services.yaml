rate_park:
  name: Rate a park
  description: >-
    Record your own review for a tracked park. Photos are attached separately
    by the Park Visits table card, which uploads them to
    /api/park_visits/upload/<place_id>.
  fields:
    place_id:
      name: Park
      description: The Google place_id of the park (the geo_location entity's place_id attribute).
      required: true
      selector:
        text:
    visit_date:
      name: Visit date
      description: The day the visit actually happened. Defaults to today in the table card, but can be back-dated.
      required: true
      selector:
        date:
    person_ratings:
      name: Person ratings
      description: >-
        Map of person id to rating out of 10, one entry per configured person
        who was actually rated (e.g. {kids: 8, mum: 7.5}). A person's id is
        their name lowercased with non-letters/digits turned into
        underscores (see the Park Visits options for the configured names).
        Nobody is required — a review only requires a visit date.
      required: false
      selector:
        object:
    playground_rating:
      name: Playground
      description: Playground rating out of 10.
      required: false
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          mode: slider
    scenery_rating:
      name: Scenery
      description: Scenery rating out of 10.
      required: false
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          mode: slider
    wildlife_rating:
      name: Wildlife
      description: Wildlife rating out of 10.
      required: false
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          mode: slider
    facilities_rating:
      name: Facilities
      description: Facilities rating out of 10.
      required: false
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          mode: slider
    parking_rating:
      name: Parking
      description: Parking rating out of 10.
      required: false
      selector:
        number:
          min: 0
          max: 10
          step: 0.5
          mode: slider
    liked:
      name: What we liked
      description: The good bits.
      required: false
      selector:
        text:
          multiline: true
    disliked:
      name: What we didn't like
      description: The not-so-good bits.
      required: false
      selector:
        text:
          multiline: true
    note:
      name: Other notes
      description: Anything else worth remembering.
      required: false
      selector:
        text:
          multiline: true

delete_review:
  name: Delete a review
  description: >-
    Remove our review for a park, including every photo uploaded with it.
    The photo files are deleted from disk. This cannot be undone.
  fields:
    place_id:
      name: Park
      description: The Google place_id of the park.
      required: true
      selector:
        text:

set_next_park:
  name: Set the next park to visit
  description: >-
    Mark a park as the one we plan to visit next. Reviewing that park clears
    the assignment automatically, since by then we've been.
  fields:
    place_id:
      name: Park
      description: The Google place_id of the park.
      required: true
      selector:
        text:

clear_next_park:
  name: Clear the next park
  description: Forget which park we planned to visit next.

delete_photo:
  name: Delete a review photo
  description: Remove a single photo from a park's review and delete the file.
  fields:
    place_id:
      name: Park
      description: The Google place_id of the park.
      required: true
      selector:
        text:
    filename:
      name: Filename
      description: The stored filename of the photo to remove.
      required: true
      selector:
        text:

set_park_tag:
  name: Link a park to an Immich tag
  description: >-
    Match a park with a tag in your Immich library. Photos carrying that tag
    are then shown for the park, so there's no need to upload copies.
  fields:
    place_id:
      name: Park
      description: The Google place_id of the park.
      required: true
      selector:
        text:
    tag_id:
      name: Immich tag
      description: The id of the Immich tag whose photos belong to this park.
      required: true
      selector:
        text:

clear_park_tag:
  name: Unlink a park's Immich tag
  description: >-
    Stop showing Immich photos for a park. The photos themselves are left
    untouched in Immich.
  fields:
    place_id:
      name: Park
      description: The Google place_id of the park.
      required: true
      selector:
        text:

add_park:
  name: Add a park
  description: >-
    Track a park the area search doesn't return — one outside the configured
    radius, or with too few Google ratings to make the ranked list. Costs a
    single Google Text Search, never a full refresh, and the park survives
    every later refresh.
  fields:
    place_id:
      name: Park
      description: The Google place_id, if you already know it.
      required: false
      selector:
        text:
    query:
      name: Search
      description: >-
        Name or address to look up, e.g. "Coombabah Lakelands". Google's top
        match is added.
      required: false
      selector:
        text:

remove_park:
  name: Remove a manually added park
  description: >-
    Stop tracking a park that was added by hand. Its review, photos and Immich
    tag are kept — re-adding the park brings them back. Parks from the area
    search can't be removed this way; change the radius or park count instead.
  fields:
    place_id:
      name: Park
      description: The Google place_id of the park.
      required: true
      selector:
        text:
