########################################################################
# Park Visits dashboard
#
# Import this as a YAML Lovelace dashboard (Settings > Dashboards > "+"
# > "New dashboard from scratch" > three-dot menu > "Edit in YAML", then
# paste this file's contents), or reference it directly if you run your
# whole HA UI in YAML mode.
#
# Requires:
#  - The "Park Visits" integration installed and configured with a Google
#    Places API key (Settings > Devices & Services > Add Integration >
#    Park Visits).
#  - www/park-visits-map-card.js copied to config/www/ and registered as a
#    dashboard resource (Settings > Dashboards > Resources > Add Resource,
#    URL "/local/park-visits-map-card.js", type "JavaScript module").
########################################################################
title: Park Visits
views:
  - title: Map
    path: map
    icon: mdi:map-legend
    cards:
      - type: custom:park-visits-map-card
        title: Parks within range
        source: park_visits
        latitude: -27.6599
        longitude: 153.2138
        default_zoom: 8
        height: 600px
      - type: entities
        title: Summary
        entities:
          - entity: sensor.nearby_parks
            name: Parks tracked
          - entity: button.refresh_parks
            name: Refresh from Google

  - title: List
    path: list
    icon: mdi:format-list-bulleted
    cards:
      - type: markdown
        title: Top parks by rating
        content: >
          {% set parks = states.geo_location
             | selectattr('attributes.source', 'eq', 'park_visits')
             | sort(attribute='attributes.rank')
             | list %}

          **{{ parks | length }} parks tracked, ranked by Google rating**


          | # | Park | Rating | Categories | Distance | Your rating |
          |---|------|--------|------------|----------|--------------|
          {% for p in parks -%}
          | {{ p.attributes.rank }} | {{ p.name }} | {{ '%.1f' | format(p.attributes.rating | float(0)) if p.attributes.rating is not none else '—' }} ({{ p.attributes.rating_count or 0 }}) | {{ (p.attributes.categories or []) | join(', ') }} | {{ '%.1f' | format(p.attributes.distance | float(0)) }} km | {{ p.attributes.our_rating ~ '/10' if p.attributes.our_rating is not none else '—' }} |
          {% endfor %}
