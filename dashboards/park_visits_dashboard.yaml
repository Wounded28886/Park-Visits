########################################################################
# Park Visits dashboard
#
# Import this as a YAML Lovelace dashboard (Settings > Dashboards > "+"
# > "New dashboard from scratch" > three-dot menu > "Edit in YAML", then
# paste this file's contents), or reference it directly if you run your
# whole HA UI in YAML mode.
#
# Requires:
#  - The "Park Visits" integration installed and configured with a Google
#    Places API key (Settings > Devices & Services > Add Integration >
#    Park Visits). The integration serves its own Lovelace cards and
#    registers them on every dashboard itself — no config/www copy and no
#    manual "Add Resource" step needed.
########################################################################
title: Park Visits
views:
  - title: Parks
    path: parks
    type: sections
    icon: mdi:format-list-bulleted
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Top parks (click a park to see reviews and photos)
            icon: mdi:format-list-numbered
          # Click a column header to sort; click a park name for its
          # detail panel, Google reviews/photos and our own review form.
          - type: custom:park-visits-table-card
            title: Top parks
            source: park_visits
            default_sort: rank
            default_direction: asc
            show_filter: true
            grid_options:
              columns: full
              rows: auto
          - type: tile
            entity: sensor.nearby_parks
            name: Parks tracked
            grid_options:
              columns: full
          - type: tile
            entity: button.refresh_parks
            name: Refresh from Google
            grid_options:
              columns: full

  - title: Gallery
    path: gallery
    type: sections
    icon: mdi:image-multiple
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Our park photos (click one for the review)
            icon: mdi:image-multiple
          - type: custom:park-visits-gallery-card
            title: Our photos
            grid_options:
              columns: full
              rows: auto
